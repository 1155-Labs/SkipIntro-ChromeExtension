<!DOCTYPE html>
<html>

<head>
  <title>Universal Skip Intro</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,700;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/odometer-theme-default.css" />

  <script src="./js/static/array.js"></script>
  <script src="/js/posthog.js"></script>

  <style>
    /* ── Dev Tools Panel ─────────────────────────────────────── */
    #dev-tools {
      display: none;
      /* hidden when devMode is off */
      flex-direction: column;
      gap: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      margin-top: 2px;
    }

    #dev-tools.visible {
      display: flex;
    }

    .dev-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      gap: 8px;
    }

    .dev-row-label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dev-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      animation: blink 2s infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .dev-btn {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 5px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
    }

    #btn-force-skip {
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: #fff;
      flex: 1;
    }

    #btn-force-skip:hover {
      opacity: 0.85;
      transform: scale(1.02);
    }

    #btn-force-skip:active {
      transform: scale(0.98);
    }

    #btn-open-logs {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    #btn-open-logs:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    #force-skip-status {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      padding: 0 16px 6px;
      min-height: 16px;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
    }

    /* dev mode footer toggle */
    #dev-mode-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 16px 10px;
      gap: 6px;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.35);
      cursor: pointer;
      user-select: none;
      letter-spacing: 0.04em;
    }

    #dev-mode-footer:hover {
      color: rgba(255, 255, 255, 0.6);
    }

    #dev-mode-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: background 0.2s;
    }

    #dev-mode-indicator.on {
      background: #4ade80;
    }
  </style>
</head>

<body>

  <main>
    <div id="remote-wrapper-background">
      <div id="remote-wrapper">
        <div id="remote-control">
          <img src="./assets/remote/darkmode/logo_dark_mode.png" alt="logo" id="main-logo" name="main-logo">
          <img src="./assets/remote/darkmode/screenCastingIcon.png" alt="logo" id="logo">
        </div>
        <div id="toggle-button-wrapper">
          <div id="toggle-track">
            <div id="toggle-button-switch"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="misc-controls">
      <div id="misc-value" class="odometer plus">0</div>
      <div id="misc-value-text">currently active users</div>
    </div>
  </main>

  <!-- Dev Tools Panel (shown when devMode is ON) -->
  <div id="dev-tools">
    <!-- Observer status row -->
    <div class="dev-row">
      <div class="dev-row-label">
        <div class="dev-status-dot" id="observer-dot"></div>
        <span id="observer-status-text">Observer running</span>
      </div>
      <button class="dev-btn" id="btn-open-logs">LOGS ↗</button>
    </div>

    <!-- Force Skip row -->
    <div class="dev-row" style="padding-top:4px; padding-bottom:4px;">
      <button class="dev-btn" id="btn-force-skip" style="width:100%;">⚡ Force Skip Now</button>
    </div>
    <div id="force-skip-status"></div>
  </div>

  <!-- Dev Mode toggle (always visible, subtle) -->
  <div id="dev-mode-footer">
    <div id="dev-mode-indicator"></div>
    <span id="dev-mode-label">DEV MODE</span>
  </div>

  <div id="footer"></div>

  <script src="./js/odometer.min.js"></script>
  <script src="./js/popup.js"></script>
</body>

</html>
